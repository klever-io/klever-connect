name: Version Packages

# Opens (or updates) a "Release Packages" PR with version bumps and changelog
# updates. Triggered manually so the maintainer controls release timing.
#
# Merging the resulting PR (signed by a human) lands the version bumps on the
# target branch — sidestepping the "signed commits required" branch protection
# that blocks bot pushes.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Version Packages
    runs-on: ubuntu-latest

    steps:
      - name: Validate Branch
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" != "develop" && "$REF_NAME" != "master" ]]; then
            echo "::error::Version Packages must run on 'develop' or 'master', got '$REF_NAME'"
            exit 1
          fi
          echo "✅ Running on allowed branch: $REF_NAME"

      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Summary
        env:
          PR_CREATED: ${{ steps.changesets.outputs.hasChangesets }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          {
            echo "## 📦 Version Packages Summary"
            echo ""
            if [[ "$PR_CREATED" == "true" ]]; then
              echo "✅ Release PR opened/updated: #${PR_NUMBER:-?}"
              echo ""
              echo "### 🚀 Next Steps"
              echo "1. Review and merge the release PR (your signed merge lands the version bumps)"
              echo "2. PR develop → master with a regular merge (preserves version commits)"
              echo "3. Run the 'Publish Packages' workflow on master"
            else
              echo "⚠️ No changesets found — nothing to version"
              echo ""
              echo "Create one with:"
              echo '```bash'
              echo "pnpm changeset"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
